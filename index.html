<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My World</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:Arial,Helvetica,sans-serif;color:#fff}
#home{position:fixed;inset:0;display:flex;justify-content:center;align-items:center;background:radial-gradient(circle at center,#260900 0%,#0b0300 35%,#000 75%);z-index:10}
#home:before{content:"";position:absolute;width:500px;height:500px;border-radius:50%;background:rgba(255,55,0,.12);filter:blur(100px)}
#fireRain{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.fire{position:absolute;top:-80px;width:4px;height:22px;border-radius:50%;background:linear-gradient(to bottom,#fff8a0 0%,#ffb000 25%,#ff4500 60%,transparent 100%);box-shadow:0 0 5px #ffcc33,0 0 12px #ff6600,0 0 25px rgba(255,50,0,.8);opacity:.9;animation:fall linear infinite,flicker .12s infinite alternate}
@keyframes fall{0%{transform:translate3d(0,-80px,0) rotate(0);opacity:0}8%{opacity:1}100%{transform:translate3d(var(--drift),115vh,0) rotate(360deg);opacity:0}}
@keyframes flicker{from{filter:brightness(.8)}to{filter:brightness(1.6)}}
#clickButton{position:relative;z-index:20;padding:18px 42px;border:1px solid rgba(255,255,255,.8);border-radius:50px;background:rgba(0,0,0,.35);color:#fff;font-size:22px;font-weight:bold;letter-spacing:5px;cursor:pointer;backdrop-filter:blur(8px);box-shadow:0 0 15px rgba(255,70,0,.7),0 0 45px rgba(255,30,0,.25);animation:buttonPulse 2s infinite}
@keyframes buttonPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
#clickButton:hover{background:rgba(255,70,0,.15)}
#secret{position:fixed;inset:0;display:none;justify-content:center;align-items:center;flex-direction:column;text-align:center;background:radial-gradient(circle at 50% 35%,#260900,#090000 45%,#000 80%);z-index:5}
#secret:before{content:"";position:absolute;width:300px;height:300px;border-radius:50%;background:rgba(255,60,0,.2);filter:blur(90px);animation:glow 3s infinite alternate}
@keyframes glow{from{transform:scale(.8);opacity:.4}to{transform:scale(1.3);opacity:.8}}
.dancer{position:relative;z-index:3;width:min(330px,75vw);max-height:58vh;object-fit:contain;border-radius:20px;filter:drop-shadow(0 0 10px rgba(255,70,0,.7)) drop-shadow(0 0 35px rgba(255,30,0,.4));animation:dancerAppear 1.2s ease}
@keyframes dancerAppear{from{opacity:0;transform:scale(.7) translateY(40px)}to{opacity:1;transform:scale(1) translateY(0)}}
.title{position:relative;z-index:5;margin-top:25px;font-size:clamp(25px,7vw,46px);font-weight:900;letter-spacing:6px;text-transform:uppercase;background:linear-gradient(90deg,#fff,#ffb08a,#fff);-webkit-background-clip:text;color:transparent;text-shadow:0 0 20px rgba(255,70,0,.5);animation:textAppear 1.5s ease}
.subtitle{position:relative;z-index:5;margin-top:13px;font-size:14px;letter-spacing:4px;color:rgba(255,255,255,.7);animation:textAppear 2s ease}
@keyframes textAppear{from{opacity:0;transform:translateY(25px)}to{opacity:1;transform:translateY(0)}}
#soundButton{position:absolute;right:20px;bottom:20px;z-index:20;width:45px;height:45px;border-radius:50%;border:1px solid rgba(255,255,255,.3);background:rgba(0,0,0,.45);color:#fff;cursor:pointer;backdrop-filter:blur(8px)}
</style>
</head>
<body>
<section id="home">
<div id="fireRain"></div>
<button id="clickButton">CLICK HERE</button>
</section>

<section id="secret">
<video class="dancer" autoplay loop muted playsinline>
<source src="dancer.mp4" type="video/mp4">
</video>
<h1 class="title">WELCOME TO MY WORLD</h1>
<p class="subtitle">STAY REAL • STAY DIFFERENT • STAY YOU</p>
<button id="soundButton">🔊</button>
</section>

<audio id="music" loop>
<source src="music.mp3" type="audio/mpeg">
</audio>

<script>
const fireRain=document.getElementById("fireRain");
for(let i=0;i<95;i++){
 const f=document.createElement("span");
 f.className="fire";
 f.style.left=Math.random()*100+"vw";
 f.style.width=(2+Math.random()*5)+"px";
 f.style.height=(12+Math.random()*25)+"px";
 f.style.setProperty("--drift",(Math.random()*180-90)+"px");
 f.style.animationDuration=(1.8+Math.random()*3.8)+"s,"+(0.08+Math.random()*.15)+"s";
 f.style.animationDelay=(-Math.random()*5)+"s,0s";
 fireRain.appendChild(f);
}

const home=document.getElementById("home");
const secret=document.getElementById("secret");
const button=document.getElementById("clickButton");
const music=document.getElementById("music");
const sound=document.getElementById("soundButton");

button.addEventListener("click",()=>{
 home.style.transition="opacity .8s ease";
 home.style.opacity="0";
 setTimeout(()=>{
   home.style.display="none";
   secret.style.display="flex";
   music.volume=.22;
   music.play().catch(()=>{});
 },800);
});

sound.addEventListener("click",()=>{
 if(music.paused){music.play();sound.textContent="🔊";}
 else{music.pause();sound.textContent="🔇";}
});
</script>
</body>
</html>
